name: CI

on:
  push:
    branches: [master]

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install huggingface_hub
        # Pinned below 1.29: it moved the xet token contract from the JSON
        # body to X-Xet-* response headers, which this server does not
        # serve yet.
        run: pip install 'huggingface_hub[cli,hf_xet]>=1.28,<1.29'

      # Unit tests and e2e tests are run together.
      # E2e tests use httptest.NewServer with a local temp dir and require
      # no external credentials; they skip when client tools are absent,
      # but this job installs them and sets CI, so missing tools fail the
      # client matrix here instead of skipping.
      - name: Test
        run: go test -timeout 30m ./...
