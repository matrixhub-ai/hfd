name: CI

on:
  push:
    branches: [master]

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install huggingface_hub
        run: pip install 'huggingface_hub'

      # git-xet is pinned by release and checksum and installed under the
      # runner temp dir; the tests configure it per command, so the runner's
      # git config is never touched.
      - name: Install git-lfs and git-xet
        env:
          GIT_XET_VERSION: v0.2.1
          GIT_XET_SHA256: e6354d55704cc838d1feed79ee27b9b89da7752ae98bd83df5797c180700fdb1
        run: |
          set -euo pipefail
          command -v git-lfs >/dev/null || (sudo apt-get update && sudo apt-get install -y git-lfs)
          git lfs version
          dir="$(mktemp -d "${RUNNER_TEMP}/git-xet.XXXXXX")"
          curl -fsSL --retry 5 --retry-all-errors -o "${dir}/git-xet.zip" \
            "https://github.com/huggingface/xet-core/releases/download/git-xet-${GIT_XET_VERSION}/git-xet-linux-x86_64.zip"
          echo "${GIT_XET_SHA256}  ${dir}/git-xet.zip" | sha256sum -c -
          unzip -q "${dir}/git-xet.zip" -d "${dir}/bin"
          chmod +x "${dir}/bin/git-xet"
          echo "${dir}/bin" >> "${GITHUB_PATH}"
          "${dir}/bin/git-xet" --version | grep -Fx "git-xet ${GIT_XET_VERSION#v}"

      # Unit tests and e2e tests are run together.
      # E2e tests use httptest.NewServer with a local temp dir and require
      # no external credentials; they skip when client tools are absent,
      # but this job installs them and sets CI, so missing tools fail the
      # client matrix here instead of skipping.
      - name: Test
        run: go test -timeout 30m ./...

  # Compatibility differences are informational; setup and capture failures fail CI.
  hf-api-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Cache fixture inputs, never server data or comparison results.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hf-api-diff-cache
          key: hf-api-diff-fixtures-v1-${{ runner.os }}-${{ hashFiles('hack/hf-api-diff/recordings/huggingface/*.json') }}
          restore-keys: hf-api-diff-fixtures-v1-${{ runner.os }}-

      - name: Compare
        env:
          HF_API_DIFF_OUTPUT: ${{ runner.temp }}/hf-api-diff-output
          HF_API_DIFF_CACHE: ${{ runner.temp }}/hf-api-diff-cache
        run: hack/hf-api-diff/ci.sh

      - uses: actions/upload-artifact@v7
        id: report
        if: always()
        with:
          name: hf-api-diff
          path: ${{ runner.temp }}/hf-api-diff-output
          if-no-files-found: ignore

      - if: always() && steps.report.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          echo "Report artifact: $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
